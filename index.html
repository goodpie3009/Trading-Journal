<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a17"><title>Trading Journal</title><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#17231e;--muted:#738078;--line:#e5eae6;--green:#137b58;--lime:#c8f36a;--red:#c84c4c;--shadow:0 8px 26px #17231e0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1120px;margin:auto;padding:22px 22px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:18px}.logo{width:38px;height:38px;border-radius:13px;background:#173d30;color:var(--lime);display:grid;place-items:center;font-size:20px}.online{font-size:12px;color:var(--muted);background:#e8eee9;padding:7px 11px;border-radius:20px}.nav{display:flex;gap:6px;margin:0 0 24px;overflow:auto}.nav button{border:0;background:transparent;padding:10px 15px;border-radius:12px;color:var(--muted);white-space:nowrap}.nav button.on{background:#183b30;color:#fff}.heading{display:flex;justify-content:space-between;align-items:end;margin:0 0 18px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted);font-weight:700}.heading h1{font-size:27px;margin:4px 0 0;letter-spacing:-.04em}.btn{border:0;border-radius:12px;padding:11px 16px;background:#173d30;color:white;font-weight:650}.btn.light{background:white;color:var(--ink);border:1px solid var(--line)}.btn.lime{background:var(--lime);color:#183328}.btn.danger{background:#fff0f0;color:var(--red)}.grid{display:grid;gap:14px}.stats4{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.metric .label{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:25px;letter-spacing:-.04em;margin:8px 0 2px}.metric small{font-size:12px;color:var(--muted)}.positive{color:var(--green)!important}.negative{color:var(--red)!important}.section{margin-top:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.sectionhead h2{font-size:16px;margin:0}.muted{color:var(--muted)}.trade{display:flex;align-items:center;gap:13px;padding:14px 0;border-top:1px solid var(--line)}.trade:first-child{border-top:0}.badge{font-size:11px;font-weight:700;border-radius:8px;padding:5px 8px;background:#eef3ef;color:#315844}.badge.open{background:#eff5df;color:#57731a}.trade-main{flex:1;min-width:0}.trade-title{font-weight:700}.trade-sub{font-size:12px;color:var(--muted);margin-top:3px}.trade-pnl{text-align:right;font-weight:750}.empty{padding:28px;text-align:center;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar select,.toolbar input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;color:var(--ink)}.two{grid-template-columns:1.2fr .8fr}.curve{height:190px;width:100%}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}.field textarea{min-height:70px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{padding:12px 14px;background:#f2f7e8;border-radius:12px;color:#506c28;font-size:13px}.settings-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.settings-row:last-child{border:0}.symbol-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.symbol{padding:14px;border:1px solid var(--line);border-radius:12px}.symbol strong{display:block}.symbol small{color:var(--muted)}dialog{border:0;border-radius:20px;padding:0;width:min(560px,calc(100% - 24px));box-shadow:0 24px 80px #0003}dialog::backdrop{background:#08140fcc;backdrop-filter:blur(3px)}.modal{padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{font-size:20px;margin:0}.x{background:#f1f4f1;border:0;border-radius:9px;width:34px;height:34px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:10px 7px;font-size:13px}.table th{color:var(--muted);font-weight:600}.bottomnav{display:none}
@media(max-width:720px){.shell{padding:16px 15px 96px}.top{margin-bottom:16px}.nav{display:none}.heading h1{font-size:24px}.heading .btn{padding:10px 12px}.stats4{grid-template-columns:repeat(2,1fr);gap:10px}.metric strong{font-size:22px}.two{grid-template-columns:1fr}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));justify-content:space-around;z-index:2}.bottomnav button{border:0;background:none;color:var(--muted);font-size:11px;display:grid;gap:3px;justify-items:center}.bottomnav button.on{color:var(--green);font-weight:700}.bottomnav span{font-size:19px}.trade{gap:8px}.trade-pnl{font-size:14px}.formgrid{grid-template-columns:1fr 1fr}.symbol-grid{grid-template-columns:1fr}.heading{align-items:center}}
</style></head><body><div id="app"></div><dialog id="modal"></dialog>
<script>
(()=>{'use strict';const KEY='tradingJournal.v1';const symbols=[{name:'XAUUSD+',assetType:'Gold',contractSize:100,calculationMethod:'CFD',profitCurrency:'USD',volumeMin:.01,volumeStep:.01,active:true},{name:'USDJPY+',assetType:'Forex',contractSize:100000,calculationMethod:'Forex',profitCurrency:'JPY',volumeMin:.01,volumeStep:.01,active:true},{name:'EURUSD+',assetType:'Forex',contractSize:100000,calculationMethod:'Forex',profitCurrency:'USD',volumeMin:.01,volumeStep:.01,active:true},{name:'GBPUSD+',assetType:'Forex',contractSize:100000,calculationMethod:'Forex',profitCurrency:'USD',volumeMin:.01,volumeStep:.01,active:true},{name:'SP500.r',assetType:'Index',contractSize:1,calculationMethod:'CFD',profitCurrency:'USD',volumeMin:.1,volumeStep:.1,active:true},{name:'BTCUSD',assetType:'Crypto',contractSize:1,calculationMethod:'CFD',profitCurrency:'USD',volumeMin:.01,volumeStep:.01,active:true}];let db=load(),page='Dashboard',filter={symbol:'',direction:'',tf:'',range:''};const app=document.querySelector('#app'),dlg=document.querySelector('#modal');function load(){try{let d=JSON.parse(localStorage.getItem(KEY));return d&&d.schemaVersion===1?d:{schemaVersion:1,account:null,symbols:structuredClone(symbols),trades:[],events:[]}}catch{return{schemaVersion:1,account:null,symbols:structuredClone(symbols),trades:[],events:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2}).format(Number(n)||0);const sign=n=>(n>0?'+':'')+money(n);const dtLocal=iso=>new Date(iso).toLocaleString('en-GB',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false});const todayLocal=()=>new Date(Date.now()+7*3600000).toISOString().slice(0,16);const closed=()=>db.trades.filter(t=>t.status==='CLOSED');const pnl=()=>closed().reduce((a,t)=>a+Number(t.actualPnL||0),0);const netFlow=()=>db.events.reduce((a,e)=>a+(e.type==='DEPOSIT'?1:-1)*Number(e.amount),0);const capital=()=>Number(db.account?.startingCapital||0)+netFlow()+pnl();function persist(){save();render()}function nav(){return ['Dashboard','Journal','Statistics','Settings'].map(x=>`<button data-page="${x}" class="${page===x?'on':''}">${x}</button>`).join('')}function shell(body,action=''){app.innerHTML=`<div class="shell"><header class="top"><div class="brand"><div class="logo">↗</div>Trading Journal</div><div class="online">● Offline ready</div></header><nav class="nav">${nav()}</nav>${body}</div><nav class="bottomnav">${['Dashboard','Journal','Statistics','Settings'].map((x,i)=>`<button data-page="${x}" class="${page===x?'on':''}"><span>${['⌂','▤','◒','⚙'][i]}</span>${x}</button>`).join('')}</nav>`;app.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>actions[b.dataset.action]?.(b.dataset.id))}function metric(label,value,sub='',cls=''){return `<div class="card metric"><div class="label">${label}</div><strong class="${cls}">${value}</strong><small>${sub}</small></div>`}function tradeCard(t){return `<div class="trade"><span class="badge ${t.status==='OPEN'?'open':''}">${t.status}</span><div class="trade-main"><div class="trade-title">${esc(t.symbol)} · ${esc(t.direction)} · ${esc(t.entryTimeframe)}</div><div class="trade-sub">${dtLocal(t.openedAt)}${t.closedAt?' → '+dtLocal(t.closedAt):''}${t.status==='CLOSED'?' · '+esc(t.result):''}</div></div><div class="trade-pnl ${Number(t.actualPnL)>0?'positive':Number(t.actualPnL)<0?'negative':''}">${t.status==='OPEN'?`Risk ${money(t.initialRisk)}`:sign(t.actualPnL)}<div class="trade-sub">${t.status==='CLOSED'?`${Number(t.resultR).toFixed(2)}R`:''}</div></div>${t.status==='OPEN'?`<button class="btn light" data-action="close" data-id="${t.id}">Đóng</button>`:''}</div>`}function dashboard(){let c=closed(),opens=db.trades.filter(t=>t.status==='OPEN'),wins=c.filter(t=>t.actualPnL>0).length,avgR=c.length?c.reduce((s,t)=>s+Number(t.resultR||0),0)/c.length:0;return `<div class="heading"><div><div class="eyebrow">Tổng quan tài khoản</div><h1>Dashboard</h1></div><button class="btn lime" data-action="new">＋ Trade mới</button></div><div class="grid stats4">${metric('Current Capital',money(capital()),'Gồm P/L đã đóng và nạp/rút')}${metric('Trading P/L',sign(pnl()),`${c.length} giao dịch đã đóng`,pnl()>=0?'positive':'negative')}${metric('Win Rate',c.length?(wins/c.length*100).toFixed(1)+'%':'—',`${wins} thắng / ${c.length} đã đóng`)}${metric('Số dư R trung bình',c.length?avgR.toFixed(2)+'R':'—','Theo Initial Risk')}</div><div class="grid two section"><div class="card"><div class="sectionhead"><h2>Đang mở <span class="badge open">${opens.length}</span></h2><button class="btn light" data-page="Journal">Xem Journal</button></div>${opens.length?opens.map(tradeCard).join(''):'<div class="empty">Chưa có giao dịch đang mở.</div>'}</div><div class="card"><div class="sectionhead"><h2>Gần đây</h2><span class="muted">Đã đóng</span></div>${c.length?c.slice().sort((a,b)=>b.closedAt.localeCompare(a.closedAt)).slice(0,4).map(tradeCard).join(''):'<div class="empty">Giao dịch đã đóng sẽ hiện ở đây.</div>'}</div></div><div class="section notice">Capital Events được tách khỏi Trading P/L. Return % chưa hiển thị trong V1.</div>`}
function journal(){let list=[...db.trades].sort((a,b)=>(a.status==='OPEN'?-1:1)-(b.status==='OPEN'?-1:1)||((b.closedAt||b.openedAt).localeCompare(a.closedAt||a.openedAt)));list=list.filter(t=>(!filter.symbol||t.symbol===filter.symbol)&&(!filter.direction||t.direction===filter.direction)&&(!filter.tf||t.entryTimeframe===filter.tf));return `<div class="heading"><div><div class="eyebrow">Lịch sử giao dịch</div><h1>Journal</h1></div><button class="btn lime" data-action="new">＋ Trade mới</button></div><div class="toolbar"><select id="fs"><option value="">Tất cả symbols</option>${db.symbols.map(s=>`<option ${filter.symbol===s.name?'selected':''}>${esc(s.name)}</option>`).join('')}</select><select id="fd"><option value="">Mọi hướng</option><option ${filter.direction==='BUY'?'selected':''}>BUY</option><option ${filter.direction==='SELL'?'selected':''}>SELL</option></select><select id="ft"><option value="">Mọi timeframe</option>${['M1','M5','M15','M30','H1','H4','D','W'].map(x=>`<option ${filter.tf===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="card">${list.length?list.map(tradeCard).join(''):'<div class="empty">Chưa có trade phù hợp.</div>'}</div>`}
function stats(){let c=closed(),by=(key)=>{let m={};c.forEach(t=>(m[t[key]]??=[]).push(t));return Object.entries(m).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.length}</td><td class="${v.reduce((a,t)=>a+t.actualPnL,0)>=0?'positive':'negative'}">${sign(v.reduce((a,t)=>a+t.actualPnL,0))}</td><td>${v.filter(t=>t.actualPnL>0).length/v.length*100|0}%</td></tr>`).join('')};let values=[Number(db.account?.startingCapital||0)];let events=[...db.events.map(e=>({at:e.dateTime,delta:(e.type==='DEPOSIT'?1:-1)*Number(e.amount)})),...c.map(t=>({at:t.closedAt,delta:Number(t.actualPnL)}))].sort((a,b)=>a.at.localeCompare(b.at));events.forEach(e=>values.push(values.at(-1)+e.delta));let max=Math.max(1,...values),min=Math.min(1,...values),points=values.map((v,i)=>`${values.length===1?50:i*100/(values.length-1)},${170-(v-min)/(max-min||1)*145}`).join(' ');return `<div class="heading"><div><div class="eyebrow">Hiệu quả theo giao dịch đã đóng</div><h1>Statistics</h1></div></div><div class="grid stats4">${metric('Trading P/L',sign(pnl()),`${c.length} giao dịch`,pnl()>=0?'positive':'negative')}${metric('Win Rate',c.length?(c.filter(t=>t.actualPnL>0).length/c.length*100).toFixed(1)+'%':'—','Trade lời / trade đã đóng')}${metric('R trung bình',c.length?(c.reduce((a,t)=>a+Number(t.resultR),0)/c.length).toFixed(2)+'R':'—','Actual P/L ÷ Initial Risk')}${metric('Current Capital',money(capital()),'Bao gồm dòng tiền')}</div><div class="grid two section"><div class="card"><div class="sectionhead"><h2>Account Balance Curve</h2><small class="muted">Có gồm nạp/rút</small></div><svg class="curve" viewBox="0 0 100 180" preserveAspectRatio="none"><polyline points="${points}" fill="none" stroke="#137b58" stroke-width="2" vector-effect="non-scaling-stroke"/><line x1="0" y1="170" x2="100" y2="170" stroke="#e5eae6"/></svg><div class="muted">Bắt đầu từ Starting Capital · thay đổi theo sự kiện thời gian</div></div><div class="card"><div class="sectionhead"><h2>Theo symbol</h2></div><table class="table"><thead><tr><th>Symbol</th><th>Trades</th><th>P/L</th><th>Win</th></tr></thead><tbody>${by('symbol')||''}</tbody></table></div></div><div class="card section"><div class="sectionhead"><h2>Theo Entry Timeframe</h2></div><table class="table"><thead><tr><th>Timeframe</th><th>Trades</th><th>P/L</th><th>Win</th></tr></thead><tbody>${by('entryTimeframe')}</tbody></table></div><div class="section notice">Weekly và Monthly được nhóm theo ngày đóng lệnh (giờ Việt Nam). Các mục này hiển thị toàn bộ trades hiện tại khi lọc thời gian được bổ sung.</div>`}
function settings(){return `<div class="heading"><div><div class="eyebrow">Tài khoản và dữ liệu</div><h1>Settings</h1></div></div><div class="grid two"><div class="card"><div class="sectionhead"><h2>Account</h2><span class="badge">${capital()<=0?'BLOWN':'ACTIVE'}</span></div><div class="settings-row"><span>Starting Capital <small class="muted">· đã khóa</small></span><strong>${money(db.account.startingCapital)}</strong></div><div class="settings-row"><span>Current Capital</span><strong>${money(capital())}</strong></div><div class="actions"><button class="btn light" data-action="event">＋ Nạp / rút</button></div></div><div class="card"><div class="sectionhead"><h2>Backup & Export</h2></div><div class="settings-row"><span>JSON backup</span><button class="btn light" data-action="export">Tải JSON</button></div><div class="settings-row"><span>CSV trades</span><button class="btn light" data-action="csv">Tải CSV</button></div><div class="settings-row"><span>Khôi phục JSON</span><button class="btn light" data-action="import">Chọn tệp</button><input id="importfile" type="file" accept="application/json,.json" hidden></div><div class="muted" style="font-size:12px">Dữ liệu lưu trên thiết bị này. Hãy tải backup định kỳ.</div></div></div><div class="card section"><div class="sectionhead"><h2>Symbols</h2><small class="muted">Cấu hình được chụp vào trade mới</small></div><div class="symbol-grid">${db.symbols.map((s,i)=>`<div class="symbol"><strong>${esc(s.name)} ${s.active?'':'· Inactive'}</strong><small>${esc(s.assetType)} · ${esc(s.calculationMethod)} · ${s.profitCurrency}</small><div class="settings-row"><span>Contract ${s.contractSize} · min ${s.volumeMin} · step ${s.volumeStep}</span><button class="btn light" data-action="symbol" data-id="${i}">Sửa</button></div></div>`).join('')}</div></div><div class="section notice">Múi giờ nhập và hiển thị: Asia/Ho_Chi_Minh (UTC+7). P/L khi đóng trade nhập bằng USD.</div>`}
function setup(){return `<div style="max-width:500px;margin:9vh auto" class="card"><div class="eyebrow">Bắt đầu nhật ký</div><h1 style="margin:5px 0 8px">Tạo account</h1><p class="muted">Starting Capital sẽ được khóa sau khi xác nhận.</p><form id="setup"><div class="field"><label>Starting Capital (USD)</label><input name="capital" type="number" min="0.01" step="0.01" required placeholder="30.00"></div><div class="actions"><button class="btn lime">Tạo account</button></div></form></div>`}
const actions={new:openTrade,close:openClose,event:openEvent,export:exportJson,csv:exportCsv,import:()=>document.querySelector('#importfile').click(),symbol:editSymbol};function render(){if(!db.account){app.innerHTML=setup();document.querySelector('#setup').onsubmit=e=>{e.preventDefault();db.account={startingCapital:Number(new FormData(e.target).get('capital')),currency:'USD',createdAt:new Date().toISOString()};db.symbols=structuredClone(symbols);persist()};return}shell(({Dashboard:dashboard,Journal:journal,Statistics:stats,Settings:settings})[page]());document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});let fs=document.querySelector('#fs'),fd=document.querySelector('#fd'),ft=document.querySelector('#ft');[fs,fd,ft].filter(Boolean).forEach((el,i)=>el.onchange=()=>{filter[['symbol','direction','tf'][i]]=el.value;render()});let imp=document.querySelector('#importfile');if(imp)imp.onchange=importJson}
function modal(title,content,onSubmit){dlg.innerHTML=`<form class="modal" id="mf"><div class="modalhead"><h2>${title}</h2><button type="button" class="x" onclick="document.querySelector('#modal').close()">×</button></div>${content}<div class="actions"><button type="button" class="btn light" onclick="document.querySelector('#modal').close()">Hủy</button><button class="btn lime">Lưu</button></div></form>`;dlg.showModal();document.querySelector('#mf').onsubmit=e=>{e.preventDefault();if(onSubmit(new FormData(e.target))!==false)dlg.close()}}
function openTrade(){let active=db.symbols.filter(s=>s.active);modal('Mở trade',`<div class="formgrid"><div class="field"><label>Symbol</label><select name="symbol">${active.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Direction</label><select name="direction"><option>BUY</option><option>SELL</option></select></div><div class="field"><label>Entry timeframe</label><select name="tf">${['M1','M5','M15','M30','H1','H4','D','W'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Volume (lots)</label><input name="volume" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Entry price</label><input name="entry" type="number" step="any" required></div><div class="field"><label>Initial Risk (USD) · tự tính</label><input name="risk" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Stop Loss · tự tính</label><input name="sl" type="number" step="any" required></div><div class="field"><label>Take Profit (optional)</label><input name="tp" type="number" step="any"></div><div class="field full"><label>Entry date/time · giờ Việt Nam</label><input name="at" type="datetime-local" value="${todayLocal()}" required></div><div class="field full"><label>Note</label><textarea name="note"></textarea></div></div><div class="muted" style="font-size:12px;margin-top:10px">Nhập Initial Risk hoặc Stop Loss; trường còn lại sẽ tự cập nhật theo Entry, hướng lệnh và volume.</div>`,f=>{let sym=db.symbols.find(s=>s.name===f.get('symbol')),risk=Number(f.get('risk')),vol=Number(f.get('volume')),entry=Number(f.get('entry')),sl=Number(f.get('sl')),direction=f.get('direction');if(risk<=0||!Number.isFinite(sl)||!entry||vol<sym.volumeMin||Math.abs((vol-sym.volumeMin)/sym.volumeStep-Math.round((vol-sym.volumeMin)/sym.volumeStep))>1e-6){alert('Nhập Initial Risk hoặc Stop Loss hợp lệ. Kiểm tra Entry và volume theo min/step của symbol.');return false}if((direction==='BUY'&&sl>=entry)||(direction==='SELL'&&sl<=entry)){alert('Stop Loss cần thấp hơn Entry với BUY và cao hơn Entry với SELL.');return false}db.trades.push({id:id(),status:'OPEN',symbol:sym.name,symbolSnapshot:structuredClone(sym),direction,entryTimeframe:f.get('tf'),volume:vol,entryPrice:entry,stopLoss:sl,takeProfit:f.get('tp')?Number(f.get('tp')):null,initialRisk:risk,openedAt:new Date(f.get('at')+'+07:00').toISOString(),note:f.get('note')});persist()});const form=document.querySelector('#mf'),field=n=>form.elements.namedItem(n);let source='risk';function syncRisk(){let sym=db.symbols.find(s=>s.name===field('symbol').value),entry=Number(field('entry').value),vol=Number(field('volume').value),risk=Number(field('risk').value),sl=Number(field('sl').value),factor=sym.profitCurrency==='USD'?1:sym.profitCurrency==='JPY'&&entry>0?1/entry:null;if(!(entry>0&&vol>0&&sym.contractSize>0&&factor)){if(source==='sl')field('risk').value='';else field('sl').value='';return}if(source==='sl'&&sl>0){let valid=field('direction').value==='BUY'?sl<entry:sl>entry;if(!valid){field('risk').value='';return}field('risk').value=(Math.abs(entry-sl)*vol*sym.contractSize*factor).toFixed(2)}else if(source==='risk'&&risk>0){let distance=risk/(vol*sym.contractSize*factor),computed=field('direction').value==='BUY'?entry-distance:entry+distance;field('sl').value=Number(computed.toPrecision(10))}}field('risk').addEventListener('input',()=>{source='risk';syncRisk()});field('sl').addEventListener('input',()=>{source='sl';syncRisk()});['symbol','direction','entry','volume'].forEach(n=>field(n).addEventListener('input',syncRisk));['symbol','direction'].forEach(n=>field(n).addEventListener('change',syncRisk))}
function openClose(tid){let t=db.trades.find(x=>x.id===tid);modal('Đóng trade',`<div class="notice" style="margin-bottom:12px">${esc(t.symbol)} · ${t.direction} · Initial Risk ${money(t.initialRisk)}</div><div class="formgrid"><div class="field"><label>Exit Price</label><input name="price" type="number" step="any" required></div><div class="field"><label>P/L thực tế (USD)</label><input name="pnl" type="number" step="0.01" required></div><div class="field"><label>Result</label><select name="result"><option>Manual Exit</option><option>TP</option><option>SL</option></select></div><div class="field"><label>Exit date/time · giờ Việt Nam</label><input name="at" type="datetime-local" value="${todayLocal()}" required></div><div class="field full"><label>Exit note</label><textarea name="note"></textarea></div></div>`,f=>{let p=Number(f.get('pnl'));t.status='CLOSED';t.exitPrice=Number(f.get('price'));t.actualPnL=p;t.result=f.get('result');t.closedAt=new Date(f.get('at')+'+07:00').toISOString();t.resultR=p/Number(t.initialRisk);t.durationMs=new Date(t.closedAt)-new Date(t.openedAt);t.exitNote=f.get('note');if(capital()<=0&&db.account.status!=='BLOWN')db.account.status='BLOWN';persist()})}
function openEvent(){modal('Ghi nhận nạp / rút',`<div class="formgrid"><div class="field"><label>Loại</label><select name="type"><option>DEPOSIT</option><option>WITHDRAWAL</option></select></div><div class="field"><label>Số tiền (USD)</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field full"><label>Ngày/giờ · giờ Việt Nam</label><input name="at" type="datetime-local" value="${todayLocal()}" required></div><div class="field full"><label>Ghi chú</label><input name="note"></div></div>`,f=>{let amount=Number(f.get('amount')),type=f.get('type');if(type==='WITHDRAWAL'&&amount>capital()){alert('Số tiền rút vượt Current Capital.');return false}db.events.push({id:id(),type,amount,dateTime:new Date(f.get('at')+'+07:00').toISOString(),note:f.get('note')});if(capital()<=0)db.account.status='BLOWN';persist()})}
function editSymbol(i){let s=db.symbols[i];modal('Cấu hình '+esc(s.name),`<div class="formgrid"><div class="field"><label>Asset type</label><input name="assetType" value="${esc(s.assetType)}" required></div><div class="field"><label>Contract size</label><input name="contractSize" type="number" value="${s.contractSize}" required></div><div class="field"><label>Calculation method</label><input name="calculationMethod" value="${esc(s.calculationMethod)}" required></div><div class="field"><label>Profit currency</label><input name="profitCurrency" value="${esc(s.profitCurrency)}" required></div><div class="field"><label>Volume min</label><input name="volumeMin" type="number" step="any" value="${s.volumeMin}" required></div><div class="field"><label>Volume step</label><input name="volumeStep" type="number" step="any" value="${s.volumeStep}" required></div><div class="field full"><label><input style="width:auto" name="active" type="checkbox" ${s.active?'checked':''}> Active · cho phép mở trade mới</label></div></div>`,f=>{for(let k of ['assetType','calculationMethod','profitCurrency'])s[k]=f.get(k);for(let k of ['contractSize','volumeMin','volumeStep'])s[k]=Number(f.get(k));s.active=f.has('active');persist()})}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportJson(){download('trading-journal-backup.json',JSON.stringify(db,null,2),'application/json')}function exportCsv(){let rows=[['id','status','symbol','direction','entryTimeframe','volume','entryPrice','stopLoss','takeProfit','initialRiskUSD','openedAt','exitPrice','closedAt','result','actualPnLUSD','resultR','note'],...db.trades.map(t=>[t.id,t.status,t.symbol,t.direction,t.entryTimeframe,t.volume,t.entryPrice,t.stopLoss??'',t.takeProfit??'',t.initialRisk,t.openedAt,t.exitPrice??'',t.closedAt??'',t.result??'',t.actualPnL??'',t.resultR??'',t.note??''])];download('trading-journal-trades.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}function importJson(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(d.schemaVersion!==1||!d.account||!Array.isArray(d.trades)||!Array.isArray(d.symbols)||!Array.isArray(d.events))throw Error();if(confirm('Khôi phục sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?')){db=d;persist()}}catch{alert('Tệp JSON không hợp lệ hoặc không tương thích. Dữ liệu hiện tại được giữ nguyên.')}e.target.value=''};reader.readAsText(file)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)actions[b.dataset.action]?.(b.dataset.id)});render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
</script></body></html>

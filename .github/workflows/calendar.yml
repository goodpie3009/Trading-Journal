name: Calendar
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch calendar
        run: |
          get() {
            for H in nfs cdn-nfs; do
              if curl -fsSL --retry 2 -A "Mozilla/5.0" "https://$H.faireconomy.media/$1" -o "$2"; then
                echo "OK $H $1"; return 0
              fi
              echo "Failed $H $1"
            done
            return 1
          }
          get ff_calendar_thisweek.json this.json
          get ff_calendar_nextweek.json next.json || echo '[]' > next.json
          jq -e 'type=="array"' this.json > /dev/null
          jq -s 'add' this.json next.json > calendar.new
          test "$(jq length calendar.new)" -gt 0
          mv calendar.new calendar.json
          rm -f this.json next.json
      - name: Commit
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add calendar.json
          git diff --cached --quiet || (git commit -m "Update calendar" && git push)
